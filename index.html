<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/kudiroll-mark.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('kudiroll-theme')
          const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {}
      })()
    </script>
    <meta name="theme-color" content="#f4f1e8" />

    <title>KudiRoll · Private Payroll</title>
  </head>

  </body>
</html>
